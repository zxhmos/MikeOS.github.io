<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOs家庭版 - 轻松上手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 20px;
        }
        
        header h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
        }
        
        .back-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            margin: 25px 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .card h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .feature {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .feature:last-child {
            border-bottom: none;
        }
        
        .feature-icon {
            font-size: 2rem;
            width: 60px;
            text-align: center;
        }
        
        .feature-content h3 {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }
        
        .feature-content p {
            opacity: 0.9;
            line-height: 1.5;
        }
        
        .generator {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 30px;
            margin: 30px 0;
            text-align: center;
        }
        
        .generator h3 {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        
        .progress-bar {
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: white;
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 6px;
        }
        
        .btn {
            padding: 15px 40px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .requirements {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .req-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .req-item h4 {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← 返回主页面</a>
        
        <header>
            <h1>🏠 MOs 家庭版</h1>
            <p>简单易用的家庭操作系统，专为日常使用设计</p>
        </header>
        
        <div class="card">
            <h2><span>✨</span> 核心功能</h2>
            
            <div class="feature">
                <div class="feature-icon">🤖</div>
                <div class="feature-content">
                    <h3>智能助手</h3>
                    <p>内置AI助手帮助您完成日常任务，回答问题，管理日程</p>
                </div>
            </div>
            
            <div class="feature">
                <div class="feature-icon">🛡️</div>
                <div class="feature-content">
                    <h3>家庭安全</h3>
                    <p>保护家人上网安全，过滤不良内容，监控设备使用</p>
                </div>
            </div>
            
            <div class="feature">
                <div class="feature-icon">🎬</div>
                <div class="feature-content">
                    <h3>媒体中心</h3>
                    <p>统一管理照片、视频和音乐，支持多种格式播放</p>
                </div>
            </div>
        </div>
        
        <div class="generator">
            <h3>📀 生成系统镜像</h3>
            <p>点击下方按钮生成家庭版ISO镜像文件</p>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            
            <div id="status">准备就绪</div>
            
            <div>
                <button class="btn" onclick="generateISO()">
                    <span>🔧</span> 生成家庭版ISO
                </button>
                <button class="btn btn-secondary" onclick="downloadISO()">
                    <span>📥</span> 下载ISO文件
                </button>
            </div>
        </div>
        
        <div class="card">
            <h2><span>💻</span> 系统要求</h2>
            <div class="requirements">
                <div class="req-item">
                    <h4>处理器</h4>
                    <p>1GHz 或更快</p>
                </div>
                <div class="req-item">
                    <h4>内存</h4>
                    <p>2GB RAM</p>
                </div>
                <div class="req-item">
                    <h4>存储</h4>
                    <p>32GB 可用空间</p>
                </div>
                <div class="req-item">
                    <h4>显卡</h4>
                    <p>DirectX 9 兼容</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let isGenerating = false;
        
        function generateISO() {
            if (isGenerating) return;
            
            isGenerating = true;
            const progressFill = document.getElementById('progressFill');
            const status = document.getElementById('status');
            
            let progress = 0;
            const interval = setInterval(() => {
                progress += 10;
                progressFill.style.width = progress + '%';
                status.textContent = `生成中... ${progress}%`;
                
                if (progress >= 100) {
                    clearInterval(interval);
                    status.textContent = '✅ 家庭版ISO生成完成！';
                    isGenerating = false;
                }
            }, 300);
        }
        
        function downloadISO() {
            const content = `MOs 家庭版 ISO 镜像
版本: 1.0.0
构建: 2024.0301
类型: 家庭版
大小: 3.8 GB
生成时间: ${new Date().toLocaleString()}

包含功能:
- 智能助手
- 家庭安全保护
- 媒体中心
- 基础办公套件

系统要求:
- 处理器: 1GHz+
- 内存: 2GB RAM
- 存储: 32GB

感谢使用MOs家庭版！`;
            
            const blob = new Blob([content], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'MOS_Home_Edition_v1.0.iso';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            alert('家庭版ISO文件下载开始！');
        }
    </script>
</body>
</html>
